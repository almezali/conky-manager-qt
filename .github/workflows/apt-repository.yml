name: Publish Debian APT Repository

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apt-repository
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install APT repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gnupg gh

      - name: Determine release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Download latest Debian packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf apt-work
          mkdir -p apt-work/pool/main
          gh release download "${{ steps.release.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir apt-work/pool/main --clobber
          test -n "$(find apt-work/pool/main -maxdepth 1 -name '*.deb' -print -quit)"
          find apt-work/pool/main -maxdepth 1 -type f -name '*.deb' -printf '%f\n'

      - name: Import APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$APT_GPG_PRIVATE_KEY"
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          key_id="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')"
          test -n "$key_id"
          echo "APT_KEY_ID=$key_id" >> "$GITHUB_ENV"
          gpg --batch --armor --export "$key_id" > apt-work/apt.gpg

      - name: Build APT repository
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s' "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import

          mkdir -p apt-work/dists/stable/main/binary-amd64
          cd apt-work

          dpkg-scanpackages --arch amd64 pool/main /dev/null > dists/stable/main/binary-amd64/Packages
          gzip -9c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz

          apt-ftparchive             -o APT::FTPArchive::Release::Origin="almezali"             -o APT::FTPArchive::Release::Label="Conky Manager Qt"             -o APT::FTPArchive::Release::Suite="stable"             -o APT::FTPArchive::Release::Codename="stable"             -o APT::FTPArchive::Release::Architectures="amd64"             -o APT::FTPArchive::Release::Components="main"             release dists/stable > dists/stable/Release

          sign_args=(--batch --yes --pinentry-mode loopback)
          if [ -n "${APT_GPG_PASSPHRASE:-}" ]; then sign_args+=(--passphrase "${APT_GPG_PASSPHRASE}"); fi

          gpg "${sign_args[@]}" --local-user "${APT_KEY_ID}" --clearsign --digest-algo SHA256 -o dists/stable/InRelease dists/stable/Release
          gpg "${sign_args[@]}" --local-user "${APT_KEY_ID}" --armor --detach-sign --digest-algo SHA256 -o dists/stable/Release.gpg dists/stable/Release

          touch .nojekyll
          grep -E '^(Package|Version|Architecture|Filename):' dists/stable/main/binary-amd64/Packages || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apt-work

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
